[project]
name = "uao-neumonia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Victor Daniel Cordoba Dorado", email = "victordanco@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "img2pdf>=0.6.3",
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "pyautogui>=0.9.54",
    "pydicom>=3.0.2",
    "python-xlib>=0.33",
    "tensorflow>=2.21.0",
    "tkcap>=0.0.4",
]

[project.scripts]
uao-neumonia = "uao_neumonia:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
